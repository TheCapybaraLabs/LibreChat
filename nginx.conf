# Default catch-all server for unknown HTTP Host headers.
# Listens on plain HTTP and returns 444 (Nginx: close connection without response)
# to silently drop requests that don't match any configured server_name below.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444; # silently close connection for unknown hosts
}

# Production HTTPS server
# - Terminates TLS for chatlabs.capybaralabs.com.br
# - Forwards requests to the local backend running on 127.0.0.1:3080
# - Uses Let's Encrypt certificates and recommended SSL options
server {
    server_name chatlabs.capybaralabs.com.br;

    # TLS listeners (HTTP/2 enabled)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # TLS certs issued by Let's Encrypt (installed on host)
    ssl_certificate /etc/letsencrypt/live/chatlabs.capybaralabs.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatlabs.capybaralabs.com.br/privkey.pem;
    # Recommended SSL options and DH params provided by certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow reasonably large uploads (adjust if needed)
    client_max_body_size 25m;

    # Preserve original client/proxy headers when forwarding to backend
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Route API calls to the backend API path and everything else to the frontend
    # Note: trailing slashes ensure the backend receives the expected path prefix
    location /api/ {

        proxy_pass http://127.0.0.1:3080/api;
    }
    location / {

        proxy_pass http://127.0.0.1:3080;
    }
}

# Production HTTP -> HTTPS redirect for the configured server_name
# Listens on port 80 and issues a 308 permanent redirect to the HTTPS URL.
server {
    listen 80;
    listen [::]:80;
    server_name chatlabs.capybaralabs.com.br;
    return 308 https://$server_name$request_uri;
}