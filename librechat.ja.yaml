  strategy: 'vertexai_mistral_ocr'

# Definition of custom endpoints
endpoints:
  all:
    titleConvo: true
    titlePrompt: |
      A concise, 5-word-or-less title for the conversation, using its same language, with no punctuation. Apply title case conventions appropriate for the language. Output only the title itself. Never directly mention the language name or the word "title".

      {convo}
