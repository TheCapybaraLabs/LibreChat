# For more information, see the Configuration Guide:
# https://www.librechat.ai/docs/configuration/librechat_yaml

# Configuration version (required)
version: 1.3.6

# Cache settings: Set to true to enable caching
cache: true

# File storage configuration
# Single strategy for all file types (legacy format, still supported)
# fileStrategy: "s3"

# Granular file storage strategies (new format - recommended)
# Allows different storage strategies for different file types
# fileStrategy:
#   avatar: "s3"        # Storage for user/agent avatar images
#   image: "firebase"   # Storage for uploaded images in chats
#   document: "local"   # Storage for document uploads (PDFs, text files, etc.)

# Available strategies: "local", "s3", "firebase"
# If not specified, defaults to "local" for all file types
# You can mix and match strategies based on your needs:
# - Use S3 for avatars for fast global access
# - Use Firebase for images with automatic optimization
# - Use local storage for documents for privacy/compliance

# Custom interface configuration
interface:
  customWelcome: 'Bem vindo ao LabsChat JA Piauí!'
  # Enable/disable file search as a chatarea selection (default: true)
  # Note: This setting does not disable the Agents File Search Capability.
  # To disable the Agents Capability, see the Agents Endpoint configuration instead.
  fileSearch: true
  # Disable web search to avoid conflicts with LLM API search capabilities
  webSearch: false
  # Disable code execution to avoid conflicts with LLM code interpreter
  runCode: false
  # Privacy policy settings
  privacyPolicy:
    externalUrl: 'https://www.capybaralabs.com.br/privacidade/gpt-labs'
    openNewTab: true

  # Terms of service
  termsOfService:
    externalUrl: 'https://www.capybaralabs.com.br/termos/gpt-labs'
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'Termos de Serviço para LabsChat JA Piauí'
    modalContent: |
      # TERMOS DE USO – PLATAFORMA LABSCHAT JA PIAUÍ

      **Versão:** 1.1
      **Data de Vigência:** 20 de Abril de 2026

      ---

      A Plataforma **LabsChat JA Piauí** ("Plataforma") é disponibilizada, **sem ônus financeiro**, pela **Capybara Labs Inova Simples (I.S.)** ("Capybara Labs"), na qualidade de desenvolvedora e apoiadora institucional que custeia infraestrutura e tokens de inferência, à **Junior Achievement Piauí** ("JA Piauí" ou "Instituição Parceira"), para suportar o programa social gratuito de formação de Jovens Aprendizes. O Usuário participa do programa na condição de **participante**, não havendo cobrança pelo uso.

      **AO ACESSAR OU UTILIZAR A PLATAFORMA, O USUÁRIO — E, QUANDO MENOR DE IDADE, TAMBÉM O SEU RESPONSÁVEL LEGAL — DECLARAM QUE LERAM, COMPREENDERAM E CONCORDAM INTEGRALMENTE COM ESTES TERMOS E COM A POLÍTICA DE PRIVACIDADE.**

      ## 1. Natureza do Acesso e Consentimento

      **1.1. Programa social gratuito.** O acesso decorre da inscrição do Usuário no programa da JA Piauí e vigora enquanto vigente o Contrato de Parceria entre JA Piauí e Capybara Labs. A licença é **gratuita, pessoal, intransferível e revogável**, restrita a **fins educacionais**.

      **1.2. Consentimento e menores de idade.** Parte dos Usuários é adolescente de 14 a 17 anos; a maioria é maior de idade. O consentimento é obtido no ato de inscrição: (i) para menores, consentimento específico e em destaque de pelo menos um dos pais ou responsáveis legais ("Responsável Legal"), nos termos do **art. 14, §1º, da LGPD**; (ii) para maiores, consentimento do próprio Usuário (**art. 7º, I, da LGPD**). Aplicam-se ainda o **ECA** e as normas de proteção de crianças e adolescentes em ambientes digitais.

      **1.3. Titularidade dos dados e acompanhamento.** Os dados pessoais permanecem sob titularidade do Usuário, nos termos da LGPD, e são tratados para as finalidades do programa descritas na Política de Privacidade. O acompanhamento disponibilizado à JA Piauí baseia-se em **métricas agregadas e anonimizadas**; não há revisão rotineira do conteúdo das interações, sendo o acesso individualizado **excepcional** e registrado em log de auditoria.

      ## 2. Uso de Inteligência Artificial

      **2.1. Natureza probabilística.** A Plataforma integra modelos de linguagem (LLMs) operados por **provedores de infraestrutura de IA contratados pela Capybara Labs**. Tais modelos são probabilísticos e podem gerar informações imprecisas, incompletas ou incorretas ("alucinações"). É responsabilidade do Usuário revisar e validar criticamente qualquer conteúdo gerado antes de utilizá-lo.

      **2.2. Não substituição profissional.** A Plataforma atua como ferramenta de apoio educacional e **não substitui** orientação pedagógica, jurídica, médica, psicológica ou financeira prestada por profissional qualificado.

      **2.3. Provedores e treinamento — disclosure.** Os provedores contratados podem variar ao longo do tempo (lista vigente na Política de Privacidade). A **Capybara Labs não treina modelos próprios** com os dados ou interações dos Usuários. Quanto a terceiros, **as políticas variam**: nos planos utilizados para viabilizar o programa gratuito, parte dos provedores pode, nos termos de suas próprias políticas, reter temporariamente os prompts e utilizá-los para aprimoramento dos seus modelos, enquanto outros não o fazem. Por isso, o Usuário deve **não inserir dados sensíveis** nem identificadores além do estritamente necessário à atividade educacional.

      ## 3. Proteção de Dados e Segurança

      **3.1. Dados vedados.** O Usuário compromete-se a **não inserir** na Plataforma dados pessoais sensíveis (art. 5º, II, da LGPD), próprios ou de terceiros, segredos industriais ou informações sigilosas de terceiros, salvo quando estritamente necessário à finalidade educacional.

      **3.2. Medidas de segurança.** A Capybara Labs adota medidas técnicas e administrativas compatíveis com o art. 46 da LGPD, incluindo **criptografia em trânsito**, controle de acesso sob o princípio do menor privilégio, logs de auditoria e monitoramento. A gestão de incidentes segue o disposto na Política de Privacidade.

      **3.3. Credenciais.** A conta é pessoal e intransferível; o Usuário é responsável pelo sigilo de suas credenciais e deve comunicar prontamente à JA Piauí qualquer uso não autorizado ou incidente de que tomar conhecimento. Para questões LGPD, contato do Encarregado: **dpo@capybaralabs.com.br**.

      ## 4. Conduta e Salvaguardas

      É **vedado** ao Usuário:

      * **I.** Gerar, solicitar ou compartilhar conteúdo ilícito, incluindo material de abuso ou exploração sexual de crianças e adolescentes, instruções para a prática de crimes, discurso de ódio, assédio, ameaças, incitação à violência, conteúdo que promova autoagressão, bem como material difamatório, discriminatório ou que viole direitos de propriedade intelectual;
      * **II.** Tentar burlar as **salvaguardas nativas dos provedores de IA** ou os **controles comportamentais da Plataforma** (*rate limit*, autenticação, banimento automático); a Capybara Labs e a JA Piauí não operam camada própria de análise semântica do conteúdo;
      * **III.** Praticar engenharia reversa, extração massiva de dados, uso automatizado não autorizado ou utilizar a Plataforma para treinamento de modelos de IA concorrentes;
      * **IV.** Compartilhar, ceder ou revender o acesso a terceiros.

      A violação poderá acarretar limitação de taxa, suspensão ou **banimento automático**, com comunicação à JA Piauí. Dada a natureza probabilística dos modelos e o fato de os filtros operarem fora do controle direto da Capybara Labs, **não se garante a supressão integral** de todo e qualquer conteúdo inadequado.

      ## 5. Disposições Gerais

      **5.1. Responsabilidade.** A Plataforma é fornecida "como está", ressalvadas as garantias legais aplicáveis. A Capybara Labs responde por danos a que der causa nos termos da legislação aplicável, inclusive, quando cabível, das normas de proteção do consumidor e dos direitos da criança e do adolescente, **ressalvados, em qualquer hipótese, os casos de dolo ou culpa grave**, sendo vedada interpretação que implique renúncia a direitos indisponíveis. Conteúdo de interações **não será utilizado** para fins disciplinares trabalhistas, avaliação de estágio/aprendizagem, nem compartilhado com empresas em que o Usuário eventualmente estagia.

      **5.2. Alterações.** A Capybara Labs poderá atualizar estes Termos para refletir mudanças legais, regulatórias ou operacionais. **Alterações materiais serão comunicadas previamente** à JA Piauí, que providenciará a comunicação aos Usuários e Responsáveis Legais, oportunidade em que poderão revogar o consentimento caso não concordem. **Não se presume aceitação tácita** quanto a alterações materiais.

      **5.3. Rescisão.** A revogação do consentimento pelo Usuário ou Responsável Legal, o desligamento do programa ou o término do Contrato de Parceria acarretam o encerramento imediato do acesso. A Plataforma utiliza **componentes de software de terceiros e de código aberto**, regidos por suas respectivas licenças.

      **5.4. Lei e foro.** Aplicam-se as leis brasileiras, em especial a LGPD, o ECA e o Marco Civil da Internet. Fica eleito o Foro de **Teresina/PI**, ressalvadas, quando aplicáveis, as hipóteses do **art. 101, I, do CDC** e do **art. 63, §3º, do CPC**.

      ---

