modelSpecs:
  # When enforce is true, only models defined in this list can be used
  # Users cannot select models outside of these specs, and requests are validated against them
  # Note: This disables endpointsMenu, modelSelect, parameters, and presets in interface (see above)
  enforce: false
  # When prioritize is true, model specs take precedence over regular model selection
  # This ensures these custom specs appear prominently in the UI
  # Note: This disables presets in interface to avoid conflicts (see above)
  prioritize: false
  list:
    # OpenAI GPT Models
    # GPT-5.4: tune reasoning_effort first, verbosity second, sampling last.
    # Web search requires reasoning_effort medium+.
    # - name: 'gpt-5.4-mini'
    #   label: 'GPT-5.4 Mini'
    #   showIconInMenu: true
    #   showIconInHeader: true
    #   default: true
    #   description: 'GPT-5.4 Mini — versão mais nova e recomendada para a maioria das tarefas. Rápido e inteligente.'
    #   preset:
    #     endpoint: 'openAI'
    #     model: 'gpt-5.4-mini'
    #     modelLabel: 'GPT-5.4 Mini'
    #     useResponsesApi: true
    #     reasoning_effort: 'medium'
    #     reasoning_summary: 'auto'
    #     verbosity: 'medium'
    #     web_search: true
    - name: 'gpt-5-mini'
      label: 'GPT-5 Mini'
      showIconInMenu: true
      showIconInHeader: true
      default: false
      description: 'GPT-5 Mini — versão anterior, ainda muito capaz. Rápido e inteligente.'
      preset:
        endpoint: 'openAI'
        model: 'gpt-5-mini'
        modelLabel: 'GPT-5 Mini'
        useResponsesApi: true
        reasoning_effort: 'medium'
        reasoning_summary: 'auto'
        verbosity: 'medium'
        web_search: true

    # Google Gemini Models
    - name: 'gemini-3-1-flash-lite-preview'
      label: 'Gemini 3.1 Flash Lite'
      showIconInMenu: true
      showIconInHeader: true
